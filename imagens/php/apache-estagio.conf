ServerName localhost
ServerTokens Prod
ErrorLog /dev/stderr
LogFormat "%a \"%r\" %>s %b" curto
CustomLog /dev/stdout curto

# Poucos processos: é um PS4, e cada estagiário tem 3 GB no total
<IfModule mpm_prefork_module>
    StartServers         2
    MinSpareServers      1
    MaxSpareServers      3
    MaxRequestWorkers    8
</IfModule>

<VirtualHost *:8080>
    DocumentRoot ${HOME_ESTAGIARIO}/public_html

    <Directory ${HOME_ESTAGIARIO}/public_html>
        # Indexes: /projeto sem index lista os arquivos, ajuda a revisar
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # IP real do visitante, vindo do proxy na frente
    RemoteIPHeader X-Real-IP
    RemoteIPInternalProxy 172.16.0.0/12
</VirtualHost>
