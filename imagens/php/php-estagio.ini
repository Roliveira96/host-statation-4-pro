; Ambiente de estudo: erros aparecem na tela para o estagiário ver
display_errors = On
error_reporting = E_ALL
memory_limit = 256M
; Cloudflare aceita até 100 MB por envio
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 60
date.timezone = America/Sao_Paulo
session.save_path = /tmp/php-sessoes
expose_php = Off
