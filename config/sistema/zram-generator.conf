# Swap comprimida na RAM (zram). Instalado em /etc/systemd/zram-generator.conf
# por scripts/configurar-sistema.sh.
#
# Por que zram e não swap no disco: o HD do PS4 é lento e o sistema inteiro já
# roda dentro de um arquivo (/dev/loop0); swap ali seria lenta e pode travar
# justamente quando falta memória. A zram comprime o que está parado na RAM
# (2 a 3x com zstd), usando a CPU que fica quase sempre ociosa.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
